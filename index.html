<body>
  <main class="page">
    <header class="heading">
      <h1>Share Button<br><span>Animation</span></h1>
    </header>

    <section class="demo" aria-label="Animated share button">
      <div class="share-widget" id="share-widget">
        <div class="channels" id="channels" aria-label="Choose a sharing channel">
          <button class="channel linkedin" type="button" data-channel="linkedin" aria-label="Share on LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5H3.2V20h3.3V8.5ZM4.85 3.5a1.9 1.9 0 1 0 0 3.8 1.9 1.9 0 0 0 0-3.8ZM20.8 13.4c0-3.45-1.84-5.05-4.3-5.05a3.72 3.72 0 0 0-3.35 1.85V8.5H9.9V20h3.25v-6.1c0-1.6.3-3.15 2.3-3.15 1.98 0 2 1.84 2 3.25V20h3.35v-6.6Z"/></svg>
          </button>
          <button class="channel whatsapp" type="button" data-channel="whatsapp" aria-label="Share on WhatsApp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.05 2.2a9.55 9.55 0 0 0-8.2 14.45L2.6 21.8l5.28-1.38a9.55 9.55 0 1 0 4.17-18.22Zm0 17.28a7.7 7.7 0 0 1-3.93-1.08l-.28-.16-3.13.82.84-3.05-.18-.3a7.72 7.72 0 1 1 6.68 3.77Zm4.24-5.78c-.23-.12-1.38-.68-1.6-.76-.21-.08-.37-.12-.53.12-.16.23-.61.76-.75.92-.14.15-.28.17-.51.05-.24-.12-.99-.36-1.88-1.14-.7-.62-1.16-1.38-1.3-1.61-.14-.23-.02-.36.1-.48.1-.1.23-.28.35-.42.12-.14.16-.24.24-.4.08-.15.04-.3-.02-.42-.06-.12-.53-1.28-.73-1.75-.19-.45-.39-.39-.53-.4h-.45c-.16 0-.42.06-.64.3-.22.23-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.1.15 1.51.09.46-.07 1.39-.57 1.59-1.12.2-.55.2-1.02.14-1.12-.06-.1-.22-.16-.45-.28Z"/></svg>
          </button>
          <button class="channel email" type="button" data-channel="email" aria-label="Share by email">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1Zm9 7.1 8-5.4H4l8 5.4Zm0 2.4L4 9.6v7h16v-7l-8 5.4Z"/></svg>
          </button>
          <button class="channel x-channel" type="button" data-channel="x" aria-label="Share on X">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.78 7.75L23.2 22h-6.25l-4.9-7.36L5.6 22H2.48l7.25-8.3L1.8 2h6.4l4.43 6.7L18.9 2Zm-1.1 18h1.73L7.26 3.88H5.4L17.8 20Z"/></svg>
          </button>
          <button class="channel copy" type="button" data-channel="copy" aria-label="Copy link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 0 1.42 0l3.54-3.54a3.5 3.5 0 0 0-4.95-4.95L8.5 7.02a1 1 0 0 0 1.42 1.42l2.12-2.12a1.5 1.5 0 0 1 2.12 2.12l-3.54 3.54a1 1 0 0 0 0 1.42Zm2.8-2.8a1 1 0 0 0-1.42 0l-3.54 3.54a3.5 3.5 0 0 0 4.95 4.95l2.12-2.12a1 1 0 1 0-1.42-1.42l-2.12 2.12a1.5 1.5 0 1 1-2.12-2.12l3.54-3.54a1 1 0 0 0 0-1.42Z"/></svg>
          </button>
        </div>

        <button class="share-main" id="share-main" type="button" aria-expanded="false" aria-controls="channels">
          <span class="main-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .1.75L8.7 8.48a3 3 0 1 0 0 7.04l6.4 3.73A3 3 0 1 0 16 17.5l-6.4-3.73a3.1 3.1 0 0 0 0-3.54L16 6.5A3 3 0 0 0 18 8Z"/></svg>
          </span>
          <span class="main-label">SHARE</span>
        </button>
        <p class="status" id="status" aria-live="polite">Pick a channel</p>
      </div>
    </section>

    <p class="hint">Open the share menu, then choose a channel</p>
    <div class="signature"><span></span> CODE_AND_CHILL</div>
